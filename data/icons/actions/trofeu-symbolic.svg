<!--
  "Jogos Zerados" button in the header bar. Drawn by hand on the 16px symbolic
  grid (Adwaita has no trophy), as filled geometry for the same reason as
  novidades-symbolic.svg: GTK recolours symbolic icons through `fill` only.
  The cup is solid on purpose; hollowed out, its 4px opening muddies at 16px.
  Both handles are one path, the right one mirrored.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="#222222">
  <!-- cup -->
  <path d="M4 1h8v4.5a4 4 0 0 1-8 0Z"/>
  <!-- handles -->
  <path d="M4 2H2.5A1.5 1.5 0 0 0 1 3.5V4.5A3 3 0 0 0 4 7.5H5V6H4A1.5 1.5 0 0 1 2.5 4.5V3.5H4Z"/>
  <path transform="matrix(-1 0 0 1 16 0)" d="M4 2H2.5A1.5 1.5 0 0 0 1 3.5V4.5A3 3 0 0 0 4 7.5H5V6H4A1.5 1.5 0 0 1 2.5 4.5V3.5H4Z"/>
  <!-- stem and base -->
  <rect x="7" y="9" width="2" height="4"/>
  <rect x="4" y="13" width="8" height="2" rx=".5"/>
</svg>
