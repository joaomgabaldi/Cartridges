<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05020f"/>
      <stop offset="0.35" stop-color="#1c0840"/>
      <stop offset="0.52" stop-color="#7a1a74"/>
      <stop offset="0.62" stop-color="#ff4f8b"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset="0.55" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#ff2f8e"/>
    </linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0a52"/>
      <stop offset="0.15" stop-color="#120533"/>
      <stop offset="1" stop-color="#04010d"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#19b8ff"/>
    </linearGradient>
    <linearGradient id="titulo2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ff8ad8"/>
      <stop offset="1" stop-color="#ff2f8e"/>
    </linearGradient>
    <linearGradient id="carro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1f6b"/>
      <stop offset="1" stop-color="#150a30"/>
    </linearGradient>
    <radialGradient id="brilho-solo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2f6e" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff2f6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="suave" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="faixas">
      <rect width="600" height="900" fill="#fff"/>
      <rect x="0" y="482" width="600" height="6" fill="#000"/>
      <rect x="0" y="500" width="600" height="9" fill="#000"/>
      <rect x="0" y="520" width="600" height="12" fill="#000"/>
      <rect x="0" y="543" width="600" height="17" fill="#000"/>
    </mask>
  </defs>

  <rect width="600" height="900" fill="url(#ceu)"/>
  <!-- estrelas -->
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.6" opacity="0.8"/><circle cx="150" cy="95" r="1.2" opacity="0.6"/>
    <circle cx="240" cy="30" r="1.4" opacity="0.7"/><circle cx="330" cy="70" r="1" opacity="0.5"/>
    <circle cx="430" cy="38" r="1.6" opacity="0.8"/><circle cx="520" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="570" cy="28" r="1" opacity="0.5"/><circle cx="105" cy="320" r="1.2" opacity="0.5"/>
    <circle cx="500" cy="330" r="1.4" opacity="0.6"/><circle cx="40" cy="410" r="1" opacity="0.4"/>
    <circle cx="565" cy="400" r="1.2" opacity="0.5"/>
  </g>

  <!-- sol listrado -->
  <circle cx="300" cy="480" r="132" fill="url(#sol)" mask="url(#faixas)"/>

  <!-- horizonte da cidade -->
  <g fill="#0e0426">
    <rect x="0" y="505" width="38" height="55"/><rect x="38" y="480" width="30" height="80"/>
    <rect x="68" y="520" width="44" height="40"/><rect x="112" y="495" width="26" height="65"/>
    <rect x="138" y="470" width="34" height="90"/><rect x="172" y="512" width="40" height="48"/>
    <rect x="212" y="528" width="30" height="32"/>
    <rect x="360" y="522" width="34" height="38"/><rect x="394" y="488" width="28" height="72"/>
    <rect x="422" y="506" width="40" height="54"/><rect x="462" y="466" width="32" height="94"/>
    <rect x="494" y="500" width="36" height="60"/><rect x="530" y="478" width="40" height="82"/>
    <rect x="570" y="514" width="30" height="46"/>
  </g>
  <g fill="#7df9ff" opacity="0.85">
    <rect x="44" y="492" width="4" height="4"/><rect x="54" y="506" width="4" height="4"/>
    <rect x="144" y="484" width="4" height="4"/><rect x="156" y="500" width="4" height="4"/>
    <rect x="470" y="480" width="4" height="4"/><rect x="480" y="496" width="4" height="4"/>
    <rect x="538" y="492" width="4" height="4"/><rect x="400" y="500" width="4" height="4"/>
  </g>
  <g fill="#ff8ad8" opacity="0.85">
    <rect x="46" y="514" width="4" height="4"/><rect x="118" y="508" width="4" height="4"/>
    <rect x="148" y="516" width="4" height="4"/><rect x="474" y="512" width="4" height="4"/>
    <rect x="552" y="506" width="4" height="4"/><rect x="430" y="520" width="4" height="4"/>
  </g>

  <!-- chão e avenida -->
  <rect x="0" y="560" width="600" height="340" fill="url(#chao)"/>
  <g stroke="#ff2f8e" stroke-width="1.5" opacity="0.35">
    <path d="M0 575H600M0 592H600M0 614H600M0 642H600M0 680H600M0 732H600M0 806H600"/>
  </g>
  <g stroke="#ff2f8e" stroke-width="1.5" opacity="0.28">
    <path d="M300 560L-420 900M300 560L-150 900M300 560L0 900M300 560L600 900M300 560L750 900M300 560L1020 900"/>
  </g>
  <path d="M270 560L330 560L700 900L-100 900Z" fill="#0b0620"/>
  <!-- linhas da avenida -->
  <path d="M270 560L-100 900" stroke="#19f3ff" stroke-width="5" fill="none" filter="url(#neon)"/>
  <path d="M330 560L700 900" stroke="#ff2f8e" stroke-width="5" fill="none" filter="url(#neon)"/>
  <g fill="#ffe66d" opacity="0.9">
    <path d="M298.5 566L301.5 566L302 576L298 576Z"/>
    <path d="M298 590L302 590L303 606L297 606Z"/>
    <path d="M297.2 626L302.8 626L304.5 650L295.5 650Z"/>
    <path d="M296 676L304 676L307 716L293 716Z"/>
    <path d="M294 760L306 760L311 830L289 830Z"/>
  </g>

  <!-- luz no asfalto -->
  <ellipse cx="300" cy="840" rx="190" ry="34" fill="url(#brilho-solo)"/>

  <!-- carro, visto de trás -->
  <g>
    <ellipse cx="300" cy="842" rx="112" ry="9" fill="#000" opacity="0.55"/>
    <rect x="196" y="804" width="30" height="34" rx="6" fill="#07030f"/>
    <rect x="374" y="804" width="30" height="34" rx="6" fill="#07030f"/>
    <!-- carroceria -->
    <path d="M190 812C190 782 200 762 222 748C250 730 350 730 378 748C400 762 410 782 410 812L410 830C410 836 406 840 400 840L200 840C194 840 190 836 190 830Z" fill="url(#carro)" stroke="#7df9ff" stroke-width="2.5" filter="url(#suave)"/>
    <!-- vidro traseiro -->
    <path d="M236 772C246 756 354 756 364 772L368 790L232 790Z" fill="#05020f" stroke="#ff8ad8" stroke-width="1.8"/>
    <path d="M252 768L270 768L258 786L244 786Z" fill="#ffffff" opacity="0.1"/>
    <!-- aerofólio -->
    <rect x="204" y="736" width="192" height="9" rx="3" fill="#150a30" stroke="#ff2f8e" stroke-width="2"/>
    <rect x="228" y="743" width="8" height="14" fill="#150a30"/>
    <rect x="364" y="743" width="8" height="14" fill="#150a30"/>
    <!-- lanternas -->
    <g filter="url(#neon)">
      <rect x="200" y="800" width="74" height="12" rx="5" fill="#ff2a4a"/>
      <rect x="326" y="800" width="74" height="12" rx="5" fill="#ff2a4a"/>
      <rect x="274" y="804" width="52" height="4" rx="2" fill="#ff2a4a" opacity="0.8"/>
    </g>
    <rect x="212" y="802" width="50" height="3" rx="1.5" fill="#fff" opacity="0.85"/>
    <rect x="338" y="802" width="50" height="3" rx="1.5" fill="#fff" opacity="0.85"/>
    <!-- placa -->
    <rect x="272" y="816" width="56" height="16" rx="3" fill="#ece7ff"/>
    <rect x="278" y="821" width="44" height="6" rx="1" fill="#2a0a52"/>
    <!-- saídas de escape -->
    <circle cx="238" cy="834" r="6" fill="#05020f" stroke="#7df9ff" stroke-width="2"/>
    <circle cx="362" cy="834" r="6" fill="#05020f" stroke="#7df9ff" stroke-width="2"/>
    <!-- luz de baixo -->
    <path d="M214 842L386 842" stroke="#19f3ff" stroke-width="4" stroke-linecap="round" filter="url(#neon)"/>
  </g>

  <!-- título -->
  <g font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
    <text x="300" y="156" font-size="108" fill="#19f3ff" opacity="0.55" filter="url(#neon)" letter-spacing="2">NEON</text>
    <text x="300" y="156" font-size="108" fill="url(#titulo)" stroke="#0a3a66" stroke-width="2" letter-spacing="2">NEON</text>
    <text x="300" y="262" font-size="108" fill="#ff2f8e" opacity="0.55" filter="url(#neon)" letter-spacing="2">DRIFT</text>
    <text x="300" y="262" font-size="108" fill="url(#titulo2)" stroke="#5a0a3a" stroke-width="2" letter-spacing="2">DRIFT</text>
  </g>
  <path d="M120 288H480" stroke="#ffe66d" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#suave)"/>
  <text x="300" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="9" text-anchor="middle" fill="#ffe66d" opacity="0.92">CORRIDA NOTURNA</text>
</svg>
