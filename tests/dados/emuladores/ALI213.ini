[Settings]
#############################################
#           模拟参数
#############################################
;应用程序ID,不是必须,但有可能会检测.
AppID = 214490

;尽量使用正确的API版本
API = 2.1.77.37

;玩家名称
PlayerName = Player

;游戏语言
Language = brazilian

;存档类型:
; ALI213(游戏目录)  0
; ALI213(我的文档)  1
; RELOADED      2
; SKIDROW       3
; FLT           4
; CODEX(3.0.4+)     5
SaveType = 0

;是否使用回调相关代码
;UseCALLBACK=0

#############################################
#           用户相关
#############################################
;用户的低位ID(设置固定用户ID的目的在于部分游戏存档会检测用户ID.)
;SteamUserID  =12345678

;用户的高位ID(当在多人游戏下,可能相同ID无法联机)
;SteamUserIDH=12345678

;用户是否处于登录状态
;IsLoggedOn=0

;用户是否处于在线状态
;Online=0

#############################################
#           DLC  相关
#############################################
;单独的DLC ID,使用格式为DLC???=数字ID
UnLockListedDLCOnly=1
;
