name: Compilar GTK corrigido

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gtk:
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      # Um de cada vez: os dois publicam na mesma pré-release, e a primeira
      # execução é quem a cria.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - pacote: gtk4
            fonte: gtk
            patches: gtk-dcomp-render-window-origin.patch gtk-gpu-clip-projetivo.patch
            dll: libgtk-4-1.dll
            trava: gtk4_package_version
            trava_hash: libgtk_sha256
          - pacote: libadwaita
            fonte: libadwaita
            patches: libadwaita-toast-fade.patch
            dll: libadwaita-1-0.dll
            trava: libadwaita_package_version
            trava_hash: libadwaita_sha256
    name: ${{ matrix.pacote }}
    steps:
      # O patch precisa chegar com LF: o `patch` do MSYS2 não casa CRLF com a árvore do tarball.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: msys2/MINGW-packages
          path: MINGW-packages
          sparse-checkout: mingw-w64-${{ matrix.pacote }}

      # release: false usa o C:\msys64 do runner, os mesmos caminhos do PC.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: true
          install: base-devel mingw-w64-ucrt-x86_64-toolchain

      - name: Conferir a receita contra o MSYS2
        id: receita
        shell: msys2 {0}
        run: |
          cd MINGW-packages/mingw-w64-${{ matrix.pacote }}
          receita="$(sed -n 's/^pkgver=//p' PKGBUILD)-$(sed -n 's/^pkgrel=//p' PKGBUILD)"
          oferecida="$(pacman -Si mingw-w64-ucrt-x86_64-${{ matrix.pacote }} | awk '/^Version/ {print $3}')"
          echo "Receita: $receita. MSYS2: $oferecida."
          if [ "$receita" != "$oferecida" ]; then
            echo "::error::A receita do ${{ matrix.pacote }} ($receita) difere do pacote publicado no MSYS2 ($oferecida). Aguarde o MSYS2 publicar o pacote e execute novamente."
            exit 1
          fi
          echo "versao=$receita" >> "$GITHUB_OUTPUT"

      # A compilação não sai byte a byte igual: refazer um pacote já publicado
      # muda o hash da DLL e quebra a trava de quem já o instalou. A versão que
      # já está na pré-release fica como está; para republicar a mesma versão
      # (o patch mudou), apague antes o anexo dela na pré-release.
      - name: Pular o que já está publicado
        id: publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          anexo="mingw-w64-ucrt-x86_64-${{ matrix.pacote }}-${{ steps.receita.outputs.versao }}-any.pkg.tar.zst"
          if gh release view gtk-corrigido --json assets --jq '.assets[].name' 2>/dev/null | grep -qxF "$anexo"; then
            echo "::notice::$anexo já está na pré-release gtk-corrigido; nada a compilar."
            echo "sim=false" >> "$GITHUB_OUTPUT"
          else
            echo "sim=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Acrescentar os patches à receita
        if: steps.publicar.outputs.sim == 'true'
        shell: msys2 {0}
        run: |
          cd MINGW-packages/mingw-w64-${{ matrix.pacote }}
          printf '\n# Cartridges: build-aux/windows/gtk-patches\n' >> PKGBUILD
          for p in ${{ matrix.patches }}; do
            cp ../../build-aux/windows/gtk-patches/$p .
            printf 'source+=("%s")\nsha256sums+=(%s)\n' "$p" "'SKIP'" >> PKGBUILD
          done
          cat >> PKGBUILD <<'EOF'
          eval "_prepare_msys2() $(declare -f prepare | tail -n +2)"
          prepare() {
            _prepare_msys2
            cd "${srcdir}/${{ matrix.fonte }}-${pkgver}"
            for p in ${{ matrix.patches }}; do
              patch -Np1 -i "${srcdir}/$p"
            done
          }
          EOF

      - name: Compilar o pacote
        if: steps.publicar.outputs.sim == 'true'
        shell: msys2 {0}
        run: |
          cd MINGW-packages/mingw-w64-${{ matrix.pacote }}
          MINGW_ARCH=ucrt64 makepkg-mingw --syncdeps --noconfirm --skippgpcheck --nocheck --cleanbuild

      - name: Hash da biblioteca
        if: steps.publicar.outputs.sim == 'true'
        shell: msys2 {0}
        run: |
          cd MINGW-packages/mingw-w64-${{ matrix.pacote }}
          pacote=$(ls mingw-w64-ucrt-x86_64-${{ matrix.pacote }}-[0-9]*-any.pkg.tar.zst)
          bsdtar -xOf "$pacote" ucrt64/bin/${{ matrix.dll }} | sha256sum | cut -d' ' -f1 | tr a-f A-F > ../../dll.sha256
          echo "$pacote" > ../../pacote.txt

      - name: Publicar na pré-release gtk-corrigido
        if: steps.publicar.outputs.sim == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pacote=$(cat pacote.txt)
          versao=${pacote#mingw-w64-ucrt-x86_64-${{ matrix.pacote }}-}; versao=${versao%-any.pkg.tar.zst}
          gh release view gtk-corrigido >/dev/null 2>&1 || gh release create gtk-corrigido \
            --prerelease --latest=false --title "GTK corrigido" \
            --notes "Bibliotecas GTK 4 e libadwaita corrigidas, usadas na geração do instalador. Não é uma versão do aplicativo."
          gh release upload gtk-corrigido "MINGW-packages/mingw-w64-${{ matrix.pacote }}/$pacote"
          {
            echo "Trava do ${{ matrix.pacote }} para build-aux/windows/gtk-patches/patched-gtk.txt:"
            echo '```'
            echo "${{ matrix.trava }}=$versao"
            echo "${{ matrix.trava_hash }}=$(cat dll.sha256)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
