name: Gerar instalador (beta)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # blueprint-compiler lê os .blp na codificação do locale; sem isto, cp1252.
  PYTHONUTF8: "1"

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # A versão é a data do dia em Brasília (UTC-3 o ano todo desde 2019). A <release>
      # do topo do metainfo passa a essa data; se ela já saiu como final, os itens
      # acrescentados depois vão para uma <release> nova. O commit volta para o branch.
      - name: Versão do dia
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metainfo=data/io.github.joaomgabaldi.Cartridges.metainfo.xml.in
          versao=$(date -u -d '-3 hours' +%Y.%m.%d)
          anterior=$(gh release list --exclude-pre-releases --exclude-drafts -L 1 --json tagName --jq '.[0].tagName // ""')
          if [ "$anterior" = "v$versao" ]; then
            echo "::error::A release v$versao já foi publicada hoje como versão final. Gere o próximo instalador amanhã."
            exit 1
          fi
          # Ponta atual do branch: num Re-run o checkout volta ao commit de antes do "Versão AAAA.MM.DD".
          git fetch -q --depth=1 origin "$GITHUB_REF_NAME"
          git reset -q --hard FETCH_HEAD
          publicado=()
          if [ -n "$anterior" ]; then
            git fetch -q --depth=1 origin "refs/tags/$anterior:refs/tags/$anterior"
            git show "$anterior:$metainfo" > "$RUNNER_TEMP/publicado.xml"
            publicado=("$RUNNER_TEMP/publicado.xml")
          fi
          python build-aux/windows/versao_do_dia.py "$metainfo" "$versao" "${publicado[@]}"
          sed -i "s/^  version: '.*',\$/  version: '$versao',/" meson.build
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am "Versão $versao"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      # release: false usa o C:\msys64 do runner, o caminho que o build-installer.ps1 espera.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-requests
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-cryptography
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gcc

      - name: GTK corrigido, tinytuya e meson setup
        shell: msys2 {0}
        run: |
          for nome in gtk4 libadwaita; do
            trava=$(sed -n "s/^${nome}_package_version=//p" build-aux/windows/gtk-patches/patched-gtk.txt | tr -d '\r')
            atual=$(pacman -Q mingw-w64-ucrt-x86_64-$nome | cut -d' ' -f2)
            if [ "$atual" != "$trava" ]; then
              echo "::error::O MSYS2 publicou o $nome $atual, mas a trava está em $trava. Execute 'Compilar GTK corrigido', teste a versão nova no PC e atualize a trava (build-aux/windows/gtk-patches/README.md)."
              exit 1
            fi
            pacote="mingw-w64-ucrt-x86_64-$nome-$trava-any.pkg.tar.zst"
            curl -fsSLO "https://github.com/$GITHUB_REPOSITORY/releases/download/gtk-corrigido/$pacote"
            pacman -U --noconfirm "$pacote"
          done
          python -m pip install --break-system-packages tinytuya==1.20.0
          meson setup _build

      # A mesma versão do PC do desenvolvedor: o Inno 6 que o runner traz compila
      # o [Code] de outro jeito (recusa Variant onde o 7 aceita). O choco ainda
      # não tem o 7; o instalador vem das releases oficiais, com o SHA-256 fixo.
      - name: Inno Setup 7
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          curl.exe -fsSL -o $exe $url
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') {
            throw 'O SHA-256 do instalador do Inno Setup 7 não confere.'
          }
          Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ALLUSERS' -Wait
          if (-not (Test-Path "$env:ProgramFiles\Inno Setup 7\ISCC.exe")) { throw 'O Inno Setup 7 não foi instalado.' }

      - name: Instalador
        run: ./build-aux/windows/build-installer.ps1

      - name: Publicar pré-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao=$(sed -n "s/^  version: '\(.*\)',\$/\1/p" meson.build)
          tag="v$versao"
          # Última versão final publicada: as notas juntam as que vieram depois dela.
          anterior=$(gh release list --exclude-pre-releases --exclude-drafts -L 1 --json tagName --jq '.[0].tagName // ""')
          C:/msys64/ucrt64/bin/python.exe build-aux/windows/notas_release.py data/io.github.joaomgabaldi.Cartridges.metainfo.xml.in "$versao" "${anterior#v}" > notas.md
          cp "_dist/Cartridges Windows.exe" Cartridges.Windows.exe
          if pre=$(gh release view "$tag" --json isPrerelease --jq .isPrerelease 2>/dev/null); then
            if [ "$pre" != "true" ]; then
              echo "::error::A release $tag já foi publicada hoje como versão final. Gere o próximo instalador amanhã."
              exit 1
            fi
            git tag -f "$tag"
            git push -f origin "refs/tags/$tag"
            gh release edit "$tag" --notes-file notas.md
            gh release upload "$tag" Cartridges.Windows.exe --clobber
          else
            gh release create "$tag" Cartridges.Windows.exe --prerelease --latest=false \
              --target "$(git rev-parse HEAD)" --title "Cartridges $versao" --notes-file notas.md
          fi
