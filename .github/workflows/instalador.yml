name: Gerar instalador (beta)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  instalador:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # O mesmo Python do app (PySide6 6.12.0 só tem rodas para ele): roda os scripts e o pip --target.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.1"

      # A <release> do topo do metainfo recebe a data de Brasília (UTC-3 o ano todo desde 2019);
      # o commit só sai se a data mudou.
      - name: Data da release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metainfo=data/io.github.joaomgabaldi.Cartridges.metainfo.xml.in
          # Ponta atual do branch: num Re-run o checkout volta ao commit de antes da "Data da release".
          git fetch -q --depth=1 origin "$GITHUB_REF_NAME"
          git reset -q --hard FETCH_HEAD
          versao=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' cartridges/shared.py)
          if [ -z "$versao" ]; then
            echo "::error::Não achei VERSION em cartridges/shared.py."
            exit 1
          fi
          if pre=$(gh release view "v$versao" --json isPrerelease --jq .isPrerelease 2>/dev/null) && [ "$pre" != "true" ]; then
            echo "::error::A versão v$versao já foi publicada. Suba a versão em cartridges/shared.py."
            exit 1
          fi
          python build-aux/windows/data_da_release.py "$metainfo" "$versao" "$(date -u -d '-3 hours' +%Y-%m-%d)"
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am "Data da release $versao"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "VERSAO=$versao" >> "$GITHUB_ENV"

      - name: Ferramentas do script
        # Só para extrair o SDK do Qt. Tudo fixado, e sem resolver dependência: o job tem `contents: write`.
        run: python -m pip install --no-deps py7zr==1.1.4 brotli==1.2.1 inflate64==1.0.4 multivolumefile==0.2.3 psutil==7.2.2 pybcj==1.0.8 pycryptodomex==3.24.1 pyppmd==1.3.1 texttable==1.7.2

      # SDK do Qt e QWindowKit baixados por tools/baixar_qt_sdk.py (o script confere o SHA-1 e
      # refaz o que não estiver completo).
      - uses: actions/cache@v4
        with:
          path: build-aux/windows/qwk/_deps
          key: qwk-deps-${{ hashFiles('tools/baixar_qt_sdk.py', 'build-aux/windows/qwk/compilar.bat', 'build-aux/windows/qwk/CMakeLists.txt', 'build-aux/windows/qwk/ponte.cpp') }}

      - name: SDK do Qt e QWindowKit
        run: python tools/baixar_qt_sdk.py

      - name: qwk_ponte.dll
        shell: cmd
        run: build-aux\windows\qwk\compilar.bat

      # Baixa e confere o ffmpeg e o Ludusavi (SHA-256 fixos no script): sem eles o canal final não monta.
      - name: Montar o app
        run: python build-aux/windows/montar_app_qt.py --canal final --destino _dist/qt-final

      # A pasta roda sozinha aqui, com dados temporários: é a única prova do libwebp_anim do ffmpeg
      # e do que falta na pasta antes de ir para quem instala. Falhou, não sai instalador.
      - name: Verificar a pasta montada
        run: .\_dist\qt-final\python\python.exe -B build-aux\windows\verificar_pasta.py _dist\qt-final

      # A mesma versão do PC do desenvolvedor: o Inno 6 que o runner traz compila
      # o [Code] de outro jeito (recusa Variant onde o 7 aceita). O choco ainda
      # não tem o 7; o instalador vem das releases oficiais, com o SHA-256 fixo.
      - name: Inno Setup 7
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          curl.exe -fsSL -o $exe $url
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') {
            throw 'O SHA-256 do instalador do Inno Setup 7 não confere.'
          }
          Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ALLUSERS' -Wait
          if (-not (Test-Path "$env:ProgramFiles\Inno Setup 7\ISCC.exe")) { throw 'O Inno Setup 7 não foi instalado.' }

      - name: Instalador
        run: |
          $repo = (Get-Location).Path
          & "$env:ProgramFiles\Inno Setup 7\ISCC.exe" "/DRepo=$repo" "/DPastaApp=$repo\_dist\qt-final" "/O$repo\_dist\instalador" "$repo\_dist\qt-final.iss"
          if ($LASTEXITCODE -ne 0) { throw 'O ISCC falhou.' }

      - name: Publicar pré-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="$VERSAO"
          tag="v$versao"
          # Última versão final publicada: as notas juntam as que vieram depois dela.
          anterior=$(gh release list --exclude-pre-releases --exclude-drafts -L 1 --json tagName --jq '.[0].tagName // ""')
          python build-aux/windows/notas_release.py data/io.github.joaomgabaldi.Cartridges.metainfo.xml.in "$versao" "${anterior#v}" > notas.md
          cp "_dist/instalador/Kyron Windows.exe" Kyron.Windows.exe
          if pre=$(gh release view "$tag" --json isPrerelease --jq .isPrerelease 2>/dev/null); then
            if [ "$pre" != "true" ]; then
              echo "::error::A versão $tag já foi publicada. Suba a versão em cartridges/shared.py."
              exit 1
            fi
            git tag -f "$tag"
            git push -f origin "refs/tags/$tag"
            gh release edit "$tag" --notes-file notas.md
            gh release upload "$tag" Kyron.Windows.exe --clobber
          else
            gh release create "$tag" Kyron.Windows.exe --prerelease --latest=false \
              --target "$(git rev-parse HEAD)" --title "Kyron $versao" --notes-file notas.md
          fi
